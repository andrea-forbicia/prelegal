[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal API: auth, persistence and AI drafting of legal agreements"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.157.0",
    "litellm>=1.106.2",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
